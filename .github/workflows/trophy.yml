name: Update GitHub Trophy

on:
  schedule:
    - cron: "0 0 * * *"   # 每天 UTC 00:00 更新
  workflow_dispatch:       # 支持手动运行

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Trophy
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: 'username=zhaishichao&theme=flat&column=7&margin-w=10&margin-h=10&no-frame=true'
          path: profile/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Trophy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/trophy.svg
          git commit -m "chore: update GitHub trophy" || exit 0
          git push
